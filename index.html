<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Drop a GPX. Get a poster. Vert turns one run into terrain." />
    <meta name="theme-color" content="#F4F6F8" />
    <title>Vert · Drop a GPX. Get a poster.</title>
    <link rel="canonical" href="https://vert.geekplux.com/" />
    <!-- Link previews (Open Graph, X). Read by the sites that unfurl the link; the page fetches
         nothing for them. The card is public/og.jpg and its moving version public/og.mp4;
         public/og-image.png (`pnpm posters`) stays as the GitHub social preview. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vert" />
    <meta property="og:title" content="Vert · Drop a GPX. Get a poster." />
    <meta
      property="og:description"
      content="Drop a GPX. Get a poster. Vert turns one run into terrain."
    />
    <meta property="og:url" content="https://vert.geekplux.com/" />
    <meta property="og:image" content="https://vert.geekplux.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Vert: your run, as terrain. A trail run drawn on its 3D terrain, the route in orange from start to summit."
    />
    <!-- og:video: the same card, moving (1200 × 630, silent H.264). Platforms that play it
         (iMessage, Discord) show it; the rest show og:image. -->
    <meta property="og:video" content="https://vert.geekplux.com/og.mp4" />
    <meta property="og:video:secure_url" content="https://vert.geekplux.com/og.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1200" />
    <meta property="og:video:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/ibm-plex-mono-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
