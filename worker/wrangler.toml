# Local development config for the tile proxy alone (`pnpm worker:dev`, `pnpm worker:types`).
# Production ships the app and the proxy as one Worker from ../wrangler.jsonc; keep the
# bindings and observability settings here in step with it. See README.md.
name = "vert-tiles"
main = "src/index.ts"
compatibility_date = "2026-10-12"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
# Privacy: invocation logs record request metadata (headers, the cf object). Keep only our own logs.
invocation_logs = false

[[r2_buckets]]
binding = "TILES"
bucket_name = "vert-tiles"

# Abuse limits, as in ../wrangler.jsonc (see worker/src/proxy.ts).
[[ratelimits]]
name = "TILE_LIMIT"
namespace_id = "3001"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "STORE_LIMIT"
namespace_id = "3002"
simple = { limit = 300, period = 60 }
